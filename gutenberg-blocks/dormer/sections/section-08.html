  <section class="section section--dark" id="calculator">
    <div class="wrap">
      <div style="text-align:center;margin-bottom:44px;">
        <span class="eyebrow">Instant Estimate</span>
        <h2 style="color:#fff;">How Much Will Your Loft Conversion Cost?</h2>
        <p style="color:var(--color-muted);max-width:500px;margin:12px auto 0;font-size:0.95rem;">Configure your options
          for an instant budget estimate. A fixed price is confirmed after your free survey.</p>
      </div>

      <div
        style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:var(--radius-card);padding:36px;max-width:840px;margin:0 auto;">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-bottom:36px;">
          <div>
            <label
              style="display:block;font-size:0.75rem;font-weight:700;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px;">Property
              Type</label>
            <div style="display:flex;flex-direction:column;gap:7px;">
              <label
                style="display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--color-muted);font-size:0.875rem;"><input
                  type="radio" name="prop" checked style="accent-color:var(--color-orange);"> Victorian / Edwardian
                Terrace</label>
              <label
                style="display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--color-muted);font-size:0.875rem;"><input
                  type="radio" name="prop" style="accent-color:var(--color-orange);"> Semi-Detached</label>
              <label
                style="display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--color-muted);font-size:0.875rem;"><input
                  type="radio" name="prop" style="accent-color:var(--color-orange);"> Detached</label>
            </div>
          </div>
          <div>
            <label
              style="display:block;font-size:0.75rem;font-weight:700;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px;">Designer
              Collection</label>
            <select
              style="width:100%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:8px;padding:10px 14px;color:#fff;font-size:0.875rem;cursor:pointer;font-family:inherit;">
              <option>Serene — from £70,000</option>
              <option>Bold — from £75,000</option>
              <option>Heritage — from £78,000</option>
              <option>Urban — from £72,000</option>
              <option>Family — from £70,000</option>
              <option>Haven — from £74,000</option>
            </select>
          </div>
          <div>
            <label
              style="display:block;font-size:0.75rem;font-weight:700;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px;">En-Suite
              Specification</label>
            <div style="display:flex;flex-direction:column;gap:7px;">
              <label
                style="display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--color-muted);font-size:0.875rem;"><input
                  type="radio" name="ensuite" checked style="accent-color:var(--color-orange);"> Standard
                (included)</label>
              <label
                style="display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--color-muted);font-size:0.875rem;"><input
                  type="radio" name="ensuite" style="accent-color:var(--color-orange);"> Premium (+£8,000)</label>
            </div>
          </div>
          <div>
            <label
              style="display:block;font-size:0.75rem;font-weight:700;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px;">Optional
              Upgrades</label>
            <div style="display:flex;flex-direction:column;gap:7px;">
              <label
                style="display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--color-muted);font-size:0.875rem;"><input
                  type="checkbox" style="accent-color:var(--color-orange);"> Extended wardrobes (+£2–5k)</label>
              <label
                style="display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--color-muted);font-size:0.875rem;"><input
                  type="checkbox" style="accent-color:var(--color-orange);"> Smart lighting (+£1.5–3k)</label>
              <label
                style="display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--color-muted);font-size:0.875rem;"><input
                  type="checkbox" style="accent-color:var(--color-orange);"> Underfloor heating (+£2–3.5k)</label>
            </div>
          </div>
        </div>

        <div
          style="border-top:1px solid rgba(255,255,255,0.1);padding-top:28px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px;">
          <div>
            <div
              style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:rgba(255,255,255,0.45);margin-bottom:5px;">
              Your Budget Estimate</div>
            <div style="font-size:2.2rem;font-weight:900;color:#fff;line-height:1;">£70,000<span
                style="font-size:1rem;opacity:0.45;font-weight:400;"> – £78,000</span></div>
            <div style="font-size:0.78rem;color:rgba(255,255,255,0.35);margin-top:4px;">Fixed price confirmed after free
              survey</div>
          </div>
          <div style="display:flex;gap:14px;flex-wrap:wrap;">
            <a href="#contact" class="btn-cta btn-cta--solid">Book My Free Survey</a>
            <a href="#" class="btn-cta btn-cta--ghost">Download Pricing Guide</a>
          </div>
        </div>
      </div>
    </div>
  </section>
